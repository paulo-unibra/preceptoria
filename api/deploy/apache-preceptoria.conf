<VirtualHost *:80>
    ServerName preceptoria.bibliafoco.com.br
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3340/ retry=0
    ProxyPassReverse / http://127.0.0.1:3340/
    ErrorLog ${APACHE_LOG_DIR}/preceptoria-error.log
    CustomLog ${APACHE_LOG_DIR}/preceptoria-access.log combined
</VirtualHost>
