# Incluir dentro dos VirtualHost HTTP e HTTPS, ANTES do ProxyPass / da API.
ProxyPass /dashboard !
ProxyPass /downloads !

RedirectMatch 302 ^/dashboard$ /dashboard/
Alias /dashboard/ /var/www/preceptoria/dashboard/
Alias /downloads/ /var/www/preceptoria/downloads/

<Directory /var/www/preceptoria>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<Directory /var/www/preceptoria/dashboard>
    FallbackResource /dashboard/index.html
    <IfModule mod_headers.c>
        <Files index.html>
            Header set Cache-Control "no-store"
        </Files>
    </IfModule>
</Directory>

<Directory /var/www/preceptoria/dashboard/assets>
    FallbackResource disabled
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </IfModule>
</Directory>

<Directory /var/www/preceptoria/downloads>
    <FilesMatch "\.apk$">
        ForceType application/vnd.android.package-archive
        <IfModule mod_headers.c>
            Header set Content-Disposition "attachment"
            Header set Cache-Control "no-cache"
            Header set X-Content-Type-Options "nosniff"
        </IfModule>
    </FilesMatch>
</Directory>
